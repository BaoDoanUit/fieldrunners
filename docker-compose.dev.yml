# Dev stack: source is bind-mounted, Vite + tsx run with watch.
# Run with:
#   docker compose -f docker-compose.dev.yml up
# then open http://localhost:5173 (Vite dev server) and the proxy on :3001.

name: fieldrunner-dev

services:
  server:
    image: node:22-bookworm-slim
    working_dir: /app
    command: >
      sh -c "npm ci && npm run dev:server"
    volumes:
      - .:/app
      - server_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    image: node:22-bookworm-slim
    working_dir: /app
    command: >
      sh -c "npm ci && npm run dev:client"
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    depends_on:
      server:
        condition: service_healthy

volumes:
  # Named volumes keep node_modules isolated per service so each can resolve
  # at its own pace without one container's install clobbering the other.
  server_node_modules:
  client_node_modules:
