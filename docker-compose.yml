# Production stack: single container, port 3001, server serves both API and
# the built client. Override the image tag with FIELD_RUNNER_IMAGE.
#
#   FIELD_RUNNER_IMAGE=ghcr.io/you/fieldrunner:0.1.0 \
#     docker compose -f docker-compose.yml up
#
# For local dev with hot reload, use `docker compose -f docker-compose.dev.yml up`.

name: fieldrunner

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FIELD_RUNNER_IMAGE:-fieldrunner:local}
    container_name: fieldrunner
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Optional: load a remote balance config at boot.
      # BALANCE_CONFIG_URL: "https://example.com/balance.json"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
